name: Build Custom RustDesk Windows

on:
  workflow_dispatch: # 支持在 Actions 頁面手動點擊按鈕觸發

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 必須自動拉取子模組

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Vcpkg & Dependencies
        shell: bash
        run: |
          echo "==== 使用 choco 穩定安裝舊版 NASM ===="
          choco install nasm --version=2.16.03 -y --no-progress
          mkdir -p /c/vcpkg/downloads/tools/nasm/nasm-3.01
          cp "/c/Program Files/NASM/nasm.exe" /c/vcpkg/downloads/tools/nasm/nasm-3.01/nasm.exe
          
          echo "==== 執行 vcpkg 初始化與安裝 ===="
          vcpkg integrate install
          vcpkg install --triplet x64-windows

      - name: Inject Custom Server Configuration
        shell: pwsh # 使用微軟原生 PowerShell 處理文字替換
        run: |
          Write-Host "==== 開始注入自建伺服器資訊 ===="
          $idServer = "${{ secrets.CUSTOM_ID_SERVER }}"
          $relayServer = "${{ secrets.CUSTOM_RELAY_SERVER }}"
          $pubKey = "${{ secrets.CUSTOM_PUB_KEY }}"
          
          # 遞迴尋找專案中所有名為 config.rs 的檔案並進行替換
          Get-ChildItem -Recurse -Filter "config.rs" | ForEach-Object {
              $content = Get-Content $_.FullName -Raw
              $content = $content -replace "rendezvous_server\.rustdesk\.com", $idServer
              $content = $content -replace "router\.rustdesk\.com", $relayServer
              $content = $content -replace "d25519_key_placeholder", $pubKey
              Set-Content $_.FullName $content -Encoding UTF-8
          }
          Write-Host "==== 伺服器資訊注入完成 ===="

      - name: Build Windows Release EXE
        shell: bash
        run: |
          echo "==== 開始利用 Rust 腳本自動編譯 RustDesk ===="
          # 最新版 RustDesk 官方不再推薦手動呼叫 flutter 步驟
          # 而是使用內置的 python 或 cargo 腳本自動拉取 flutter 依賴並打包
          # 這能 100% 避免 GitHub Actions 中的 flutter 全域路徑丟失問題
          
          # 執行官方的 Windows 構建命令
          python3 res/build.py
          
          echo "==== 編譯完成 ===="

      - name: Archive and Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows-x64
          path: |
            target/release/rustdesk.exe
            flutter/build/windows/runner/Release/
