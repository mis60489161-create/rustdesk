name: Build Custom RustDesk Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Vcpkg & Dependencies
        shell: bash
        run: |
          echo "==== 使用 choco 穩定安裝舊版 NASM ===="
          # 1. 強制透過 choco 安裝相容的 2.16.03 版本 NASM
          choco install nasm --version=2.16.03 -y --no-progress
          
          # 2. 建立 vcpkg 自動下載工具的存放路徑
          mkdir -p /c/vcpkg/downloads/tools/nasm/nasm-3.01
          
          # 3. 將 choco 安裝的舊版 nasm.exe 複製覆蓋到 vcpkg 的 3.01 目錄中
          cp "/c/Program Files/NASM/nasm.exe" /c/vcpkg/downloads/tools/nasm/nasm-3.01/nasm.exe
          
          # 4. 驗證目前 vcpkg 目錄下的 nasm 版本是否降級成功
          echo "當前 vcpkg 調用的 NASM 版本為："
          /c/vcpkg/downloads/tools/nasm/nasm-3.01/nasm.exe -v
          
          echo "==== NASM 降級完成 ===="
          
          # 5. 執行 vcpkg 初始化與安裝
          vcpkg integrate install
          vcpkg install --triplet x64-windows



      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Inject Custom Server Configuration
        shell: bash
        run: |
          echo "==== 開始注入自建伺服器資訊 ===="
          ID_SERVER="${{ secrets.CUSTOM_ID_SERVER }}"
          RELAY_SERVER="${{ secrets.CUSTOM_RELAY_SERVER }}"
          PUB_KEY="${{ secrets.CUSTOM_PUB_KEY }}"
          
          find . -name "config.rs" -exec sed -i "s/rendezvous_server\.rustdesk\.com/$ID_SERVER/g" {} +
          find . -name "router\.rustdesk\.com/$RELAY_SERVER/g" {} +
          find . -name "config.rs" -exec sed -i "s/d25519_key_placeholder/$PUB_KEY/g" {} +
          
          echo "==== 伺服器資訊注入完成 ===="

      - name: Fetch Flutter Dependencies
        run: |
          cd flutter
          flutter pub get
          cd ..

      - name: Pre-build & Generate Code
        run: |
          cargo install cargo-bundle

      - name: Build Release EXE
        run: |
          cd flutter
          flutter build windows --release
          cd ..

      - name: Archive and Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows-x64
          path: |
            flutter/build/windows/runner/Release/
